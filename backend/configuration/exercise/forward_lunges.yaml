secondary_muscles:
  - "Hamstrings"
  - "Core"
  - "Calves"

instructions:
  - "Stand tall with your feet hip-width apart."
  - "Step one foot forward and lower your hips until both knees are bent to about ninety degrees."
  - "Keep your front knee above your ankle and avoid letting it travel past your toes."
  - "Push through your front heel to return to standing, then alternate legs."
