name: "Wall Sit"
category: "Lower Body"
difficulty: "Beginner"
exercise_type: "Duration"
movement_type: "Isolation"

equipment:
  - wall

primary_muscles:
  - "Quadriceps"

secondary_muscles:
  - "Glutes"
  - "Calves"
  - "Core"

instructions:
  - "Stand with your back flat against a wall and your feet about two steps forward."
  - "Slide down the wall until your knees are bent to ninety degrees."
  - "Keep your thighs parallel to the floor and your knees above your ankles."
  - "Hold the position with your back pressed into the wall, breathing steadily."
