instructions:
  - "Stand with your feet together and your hands in front of your chest."
  - "Take a wide step to one side and push your hips back as you bend that knee."
  - "Keep the trailing leg straight and both feet flat on the floor."
  - "Push off the bent leg to return to the centre, then alternate sides."
