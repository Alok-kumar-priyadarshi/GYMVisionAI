instructions:
  - "Sit with your knees bent and your heels lightly touching the floor."
  - "Lean back to about forty-five degrees and keep your back straight."
  - "Clasp your hands and rotate your torso to touch the floor beside one hip."
  - "Rotate to the opposite side, turning through your ribs rather than your arms."
