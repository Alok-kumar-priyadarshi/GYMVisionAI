instructions:
  - "Sit on the edge of a sturdy chair and grip the front edge beside your hips."
  - "Slide your hips forward off the seat with your legs extended in front of you."
  - "Bend your elbows straight back to lower your hips towards the floor."
  - "Press through your palms to straighten your arms, keeping your shoulders down."
