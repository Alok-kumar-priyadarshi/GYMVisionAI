instructions:
  - "Lie on your back with one knee bent and that foot flat on the floor."
  - "Extend the opposite leg straight out, keeping your thighs level with each other."
  - "Drive through the planted heel to lift your hips into a straight line."
  - "Lower under control, complete your repetitions, then switch legs."
