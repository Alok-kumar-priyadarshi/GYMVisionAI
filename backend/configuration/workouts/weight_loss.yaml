# Weight Loss
#
# Workout generation template. Read-only at runtime.
# Schema: app/engines/workout/workout_template.py
#
# Higher repetitions and short rest keep the heart rate elevated.

id: WO-0001
version: 1.0.0
goal: "Weight Loss"
name: "Fat Burn Circuit"

seconds_per_repetition: 3
allow_equipment: false

muscle_emphasis:
  - "Quadriceps"
  - "Glutes"
  - "Core"
  - "Calves"

levels:
  - fitness_level: "Beginner"
    warm_up_exercises: 2
    compound_exercises: 2
    isolation_exercises: 1
    core_exercises: 2
    sets: 2
    repetitions: 14
    hold_seconds: 20
    rest_seconds: 30

  - fitness_level: "Intermediate"
    warm_up_exercises: 2
    compound_exercises: 3
    isolation_exercises: 2
    core_exercises: 3
    sets: 3
    repetitions: 16
    hold_seconds: 30
    rest_seconds: 25

  - fitness_level: "Advanced"
    warm_up_exercises: 2
    compound_exercises: 4
    isolation_exercises: 2
    core_exercises: 3
    sets: 3
    repetitions: 18
    hold_seconds: 45
    rest_seconds: 20
